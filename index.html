<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical, og:type/url/title/description, hreflang, JSON-LD and the
         analytics beacon are added per page by scripts/prerender.mjs (from src/seo/head.js). -->
    <!--app-head-->
    <meta name="theme-color" content="#FAF8F2" />

    <!-- Vite swaps the BASE_URL token for the base path, so these work under any base path
         whether or not the files exist in public/ at build time. -->
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <meta property="og:site_name" content="GTA Washer &amp; Dryer Rentals" />
    <meta property="og:image" content="https://washerrent.com/og-image.jpg" />
    <meta property="og:image:alt" content="GTA Washer &amp; Dryer Rentals: washer and dryer rental in Toronto and the GTA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://washerrent.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
